<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luix Maidden</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#111;
  color:white;
  text-align:center;
}

header{
  padding:60px 20px 30px;
}

header h1{
  font-size:48px;
  color:#00f0ff;
}

section{
  padding:40px 20px;
  max-width:900px;
  margin:auto;
}

.card{
  background:#1e1e1e;
  padding:30px;
  margin:20px 0;
  border-radius:10px;
}

.live{
  background:#b30000;
  padding:20px;
  border-radius:10px;
  margin:20px 0;
  font-weight:bold;
  display:none;
}

.links a{
  display:inline-block;
  margin:10px;
  padding:12px 25px;
  border-radius:25px;
  text-decoration:none;
  font-weight:bold;
  background:#6a00ff;
  color:white;
}
</style>
</head>

<body>

<header>
  <h1>Luix Maidden</h1>
  <p>Gaming • Streaming • Proyectos Digitales</p>
</header>

<section>

<div id="liveBox" class="live">
🔴 Estoy en vivo ahora mismo en Twitch  
<br><br>
<a href="https://www.twitch.tv/luixmaidden" target="_blank" style="color:white;">
Ir al directo
</a>
</div>

<div class="card">
  <h2>Sobre mí</h2>
  <p>Creador de contenido enfocado en gaming y proyectos digitales.</p>
</div>

<div class="card">
  <h2>Mis Canales</h2>
  <div class="links">
    <a href="https://www.youtube.com/@LX-TV" target="_blank">YouTube</a>
    <a href="https://www.tiktok.com/@lx.tv" target="_blank">TikTok</a>
    <a href="https://www.twitch.tv/luixmaidden" target="_blank">Twitch</a>
  </div>
</div>

</section>

<script>
async function checkLive() {
  const clientId = "TU_CLIENT_ID";
  
  const response = await fetch("https://api.twitch.tv/helix/streams?user_login=luixmaidden", {
    headers: {
      "Client-ID": clientId
    }
  });

  const data = await response.json();

  if (data.data && data.data.length > 0) {
    document.getElementById("liveBox").style.display = "block";
  }
}

checkLive();
</script>

</body>
</html>
