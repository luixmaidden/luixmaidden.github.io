<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luix Maidden</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  background: radial-gradient(circle at top, #1a1a2e, #0f0c29 70%);
  color:white;
  overflow-x:hidden;
}

/* HERO */

.hero{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

.hero h1{
  font-size:60px;
  letter-spacing:4px;
  background: linear-gradient(90deg,#00f0ff,#6a00ff,#ff00c8);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  margin-top:15px;
  font-size:20px;
  opacity:0.8;
}

/* SECCIÓN REDES */

.section{
  padding:80px 20px;
  text-align:center;
}

.section h2{
  font-size:32px;
  margin-bottom:40px;
}

.social-grid{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:25px;
}

.social-card{
  width:220px;
  padding:25px;
  border-radius:20px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  transition:0.3s;
  text-decoration:none;
  color:white;
  border:1px solid rgba(255,255,255,0.1);
}

.social-card:hover{
  transform:translateY(-10px);
  box-shadow:0 0 25px rgba(106,0,255,0.6);
}

.social-card h3{
  margin-bottom:10px;
}

/* FOOTER */

footer{
  text-align:center;
  padding:30px;
  opacity:0.5;
  border-top:1px solid rgba(255,255,255,0.1);
}

</style>

</head>

<body>

<section class="hero">
  <h1>Luix Maidden</h1>
  <div class="subtitle">Gaming • Esports • Streaming • Contenido Digital</div>
</section>

<section class="section">
  <h2>Mis Plataformas</h2>

  <div class="social-grid">

    <a href="https://www.youtube.com/@LX-TV" target="_blank" class="social-card">
      <h3>YouTube</h3>
      <p>Gameplays, directos y contenido épico.</p>
    </a>

    <a href="https://www.tiktok.com/@lx.tv" target="_blank" class="social-card">
      <h3>TikTok</h3>
      <p>Clips rápidos y momentos virales.</p>
    </a>

    <a href="https://luixmaidden.blogspot.com/" target="_blank" class="social-card">
      <h3>Blog</h3>
      <p>Noticias, ideas y proyectos.</p>
    </a>

  </div>
</section>

<footer>
© 2026 Luix Maidden
</footer>

</body>
</html>
