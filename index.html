<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luix Maidden</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#111;
  color:white;
  text-align:center;
}

header{
  padding:60px 20px 30px;
}

header h1{
  font-size:48px;
  color:#00f0ff;
  margin-bottom:10px;
}

header p{
  opacity:0.8;
}

.profile{
  margin:30px 0;
}

.profile img{
  width:180px;
  height:180px;
  object-fit:cover;
  border-radius:50%;
  border:4px solid #6a00ff;
}

section{
  padding:40px 20px;
  max-width:900px;
  margin:auto;
}

.card{
  background:#1e1e1e;
  padding:30px;
  margin:20px 0;
  border-radius:10px;
}

iframe{
  width:100%;
  max-width:800px;
  height:450px;
  border-radius:10px;
}

.links a{
  display:inline-block;
  margin:10px;
  padding:12px 25px;
  border-radius:25px;
  text-decoration:none;
  font-weight:bold;
  background:#6a00ff;
  color:white;
}

.links a:hover{
  background:#00f0ff;
  color:black;
}

footer{
  padding:30px;
  opacity:0.5;
}
</style>
</head>

<body>

<header>
  <h1>Luix Maidden</h1>
  <p>Gaming • Streaming • Proyectos Digitales</p>
</header>

<div class="profile">
  <img src="foto.jpg" alt="Luix Maidden">
</div>

<section>

  <div class="card">
    <h2>Video Destacado</h2>
    <iframe 
      src="https://www.youtube.com/embed/UWO-i2RhpWg"
      frameborder="0"
      allowfullscreen>
    </iframe>
  </div>

  <div class="card">
    <h2>Sobre mí</h2>
    <p>Soy creador de contenido enfocado en gaming, streaming y proyectos digitales. Construyo comunidad y desarrollo ideas que impacten.</p>
  </div>

  <div class="card">
    <h2>Mis Canales</h2>
    <div class="links">
      <a href="https://www.youtube.com/@LX-TV" target="_blank">YouTube</a>
      <a href="https://www.tiktok.com/@lx.tv" target="_blank">TikTok</a>
      <a href="https://www.twitch.tv/luixmaidden" target="_blank">Twitch</a>
    </div>
  </div>

</section>

<footer>
© 2026 Luix Maidden
</footer>

</body>
</html>
