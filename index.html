<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luix Maidden</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  background: radial-gradient(circle at top, #3b0a63, #1a0033 70%);
  color:white;
  text-align:center;
  overflow-x:hidden;
}

/* Luces gamer */
body::before{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:
    radial-gradient(circle at 20% 30%, rgba(162, 0, 255, 0.4), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(0, 200, 255, 0.3), transparent 40%);
  z-index:-1;
}

/* HEADER */
header{
  padding:90px 20px 50px;
}

header h1{
  font-size:72px;
  background: linear-gradient(90deg,#00f0ff,#a020f0);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

header p{
  margin-top:15px;
  opacity:0.85;
  font-size:20px;
}

/* SECCIONES */
section{
  max-width:1000px;
  margin:auto;
  padding:30px 20px;
}

.card{
  background: rgba(40, 0, 80, 0.6);
  backdrop-filter: blur(10px);
  border:1px solid rgba(162, 0, 255, 0.3);
  padding:30px;
  margin:30px 0;
  border-radius:18px;
}

.card h2{
  margin-bottom:20px;
  color:#d18bff;
}

/* VIDEO */
iframe{
  width:560px;
  height:315px;
  max-width:100%;
  border-radius:12px;
}

/* BOTONES */
.links{
  margin-top:20px;
}

.links a{
  display:inline-block;
  margin:10px;
  padding:14px 30px;
  border-radius:30px;
  text-decoration:none;
  font-weight:bold;
  color:white;
  transition:0.3s;
}

.youtube-btn{ background:#ff0000; }
.tiktok-btn{ background:#000000; }
.twitch-btn{ background:#9146FF; }
.kick-btn{ background:#53FC18; color:black; }
.x-btn{ background:#000000; }

.links a:hover{
  transform:scale(1.1);
  box-shadow:0 0 18px rgba(160,32,240,0.9);
}

/* FOOTER */
footer{
  padding:40px 20px;
  opacity:0.6;
}
</style>
</head>

<body>

<header>
  <h1>Luix Maidden</h1>
  <p>Gaming • Streaming • Proyectos Digitales</p>
</header>

<section>

  <div class="card">
    <h2>Video Destacado</h2>
    <iframe 
      src="https://www.youtube.com/embed/UWO-i2RhpWg?rel=0&modestbranding=1"
      frameborder="0"
      allowfullscreen>
    </iframe>
  </div>

  <div class="card">
    <h2>En Vivo en Twitch</h2>
    <iframe
      src="https://player.twitch.tv/?channel=luixmaidden&parent=luixmaidden.github.io"
      height="400"
      width="100%"
      allowfullscreen>
    </iframe>
  </div>

  <div class="card">
    <h2>Sobre mí</h2>
    <p>
      Creador de contenido enfocado en gaming competitivo, streaming
      y proyectos digitales. Construyendo comunidad con identidad propia.
    </p>
  </div>

  <div class="card">
    <h2>Mis Canales</h2>
    <div class="links">
      <a href="https://www.youtube.com/@LX-TV" target="_blank" class="youtube-btn">YouTube</a>
      <a href="https://www.tiktok.com/@lx.tv" target="_blank" class="tiktok-btn">TikTok</a>
      <a href="https://www.twitch.tv/luixmaidden" target="_blank" class="twitch-btn">Twitch</a>
      <a href="https://kick.com/luixmaidden" target="_blank" class="kick-btn">Kick</a>
      <a href="https://x.com/LXTVURUGUAY" target="_blank" class="x-btn">X</a>
    </div>
  </div>

</section>

<footer>
© 2026 Luix Maidden
</footer>

</body>
</html>
