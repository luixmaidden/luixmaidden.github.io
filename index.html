<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LX TV</title>

<style>
body {
  margin: 0;
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
}

.container {
  padding: 100px 20px;
}

h1 {
  font-size: 50px;
  margin-bottom: 10px;
}

.tagline {
  font-size: 18px;
  opacity: 0.8;
  margin-bottom: 50px;
}

.buttons {
  margin-top: 40px;
}

.buttons a {
  display: inline-block;
  margin: 10px;
  padding: 15px 30px;
  background: #6a00ff;
  color: white;
  text-decoration: none;
  border-radius: 40px;
  font-weight: bold;
  transition: 0.3s;
}

.buttons a:hover {
  background: #00f0ff;
  color: black;
  transform: scale(1.1);
}

footer {
  margin-top: 80px;
  opacity: 0.6;
}
</style>

</head>
<body>

<div class="container">
  <h1>LX TV</h1>
  <div class="tagline">Gaming • Esports • Contenido con identidad</div>

  <div class="buttons">
    <a href="https://www.youtube.com/@LX-TV" target="_blank">YouTube</a>
    <a href="https://www.tiktok.com/@lx.tv" target="_blank">TikTok</a>
    <a href="https://luixmaidden.blogspot.com/" target="_blank">Blog</a>
  </div>

  <footer>
    © 2026 LX TV
  </footer>
</div>

</body>
</html>
