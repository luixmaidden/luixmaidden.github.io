<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luix Maidden</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#0f0c29,#302b63,#24243e);
  color:white;
  text-align:center;
}

.hero{
  padding:80px 20px 40px;
}

.hero h1{
  font-size:50px;
  margin-bottom:10px;
  color:#00f0ff;
}

.subtitle{
  opacity:0.8;
  font-size:18px;
}

.video-section{
  max-width:900px;
  margin:40px auto;
  padding:0 20px;
}

.video-container{
  position:relative;
  padding-bottom:56.25%;
  height:0;
  overflow:hidden;
  border-radius:15px;
  box-shadow:0 0 30px rgba(0,240,255,0.4);
}

.video-container iframe{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
}

.section{
  padding:60px 20px;
  max-width:800px;
  margin:auto;
}

.card{
  background:#1e1e1e;
  padding:30px;
  margin:20px 0;
  border-radius:15px;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 0 20px rgba(106,0,255,0.5);
}

.links a{
  display:inline-block;
  margin:10px;
  padding:12px 25px;
  border-radius:30px;
  text-decoration:none;
  font-weight:bold;
  background:#6a00ff;
  color:white;
  transition:0.3s;
}

.links a:hover{
  background:#00f0ff;
  color:black;
  transform:scale(1.05);
}

footer{
  padding:30px;
  opacity:0.5;
}
</style>
