<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luix Maidden</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background: radial-gradient(circle at top, #2a0f4f, #120026 60%, #090014 100%);
  color:white;
  text-align:center;
}

/* luces gamer violetas */
body::before{
  content:"";
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:
    radial-gradient(circle at 80% 20%, rgba(138,43,226,0.4), transparent 40%),
    radial-gradient(circle at 20% 80%, rgba(75,0,130,0.4), transparent 40%);
  z-index:-1;
}

header{
  padding:80px 20px 40px;
}

header h1{
  font-size:72px;
  margin-bottom:15px;
  background: linear-gradient(90deg,#00f0ff,#a020f0);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

header p{
  opacity:0.85;
  font-size:20px;
}

.profile{
  margin:30px 0;
}

.profile img{
  width:200px;
  height:200px;
  object-fit:cover;
  border-radius:50%;
  border:4px solid #a020f0;
}

section{
  padding:40px 20px;
  max-width:900px;
  margin:auto;
}

.card{
  background: rgba(30, 0, 60, 0.6);
  backdrop-filter: blur(8px);
  border:1px solid rgba(138,43,226,0.3);
  padding:30px;
  margin:20px 0;
  border-radius:15px;
}

.card h2{
  color:#c770ff;
}

iframe{
  width:560px;
  height:315px;
  max-width:100%;
  border-radius:10px;
}

.links{
  margin-top:20px;
}

.links a{
  display:inline-block;
  margin:10px;
  padding:14px 28px;
  border-radius:30px;
  text-decoration:none;
  font-weight:bold;
  color:white;
  transition:0.3s;
}

/* Botones individuales */

.youtube-btn{ background:#ff0000; }
.tiktok-btn{ background:#000000; }
.twitch-btn{ background:#9146FF; }
.kick-btn{ background:#53FC18; color:black; }
.x-btn{ background:#000000; }

.links a:hover{
  transform:scale(1.08);
  box-shadow:0 0 15px rgba(160,32,240,0.7);
}

footer{
  padding:30px;
  opacity:0.6;
}
</style>
</head>

<body>

<header>
  <h1>Luix Maidden</h1>
  <p>Gaming • Streaming • Proyectos Digitales</p>
</header>

<div class="profile">
  <!-- Cambiá foto.jpg por el nombre real de tu imagen -->
  <img src="foto.jpg" alt="Luix Maidden">
</div>

<section>

  <div class="card">
    <h2>Video Destacado</h2>
    <iframe 
      src="https://www.youtube.com/embed/UWO-i2RhpWg?rel=0&modestbranding=1"
      frameborder="0"
      allowfullscreen>
    </iframe>
  </div>

  <div class="card">
    <h2>Sobre mí</h2>
    <p>
      Soy creador de contenido enfocado en gaming, streaming y proyectos digitales.
      Construyo comunidad y desarrollo ideas con identidad propia.
    </p>
  </div>

  <div class="card">
    <h2>Mis Canales</h2>
    <div class="links">
      <a href="https://www.youtube.com/@LX-TV" target="_blank" class="youtube-btn">YouTube</a>
      <a href="https://www.tiktok.com/@lx.tv" target="_blank" class="tiktok-btn">TikTok</a>
      <a href="https://www.twitch.tv/luixmaidden" target="_blank" class="twitch-btn">Twitch</a>
      <a href="https://kick.com/luixmaidden" target="_blank" class="kick-btn">Kick</a>
      <a href="https://x.com/LXTVURUGUAY" target="_blank" class="x-btn">X</a>
    </div>
  </div>

</section>

<footer>
© 2026 Luix Maidden
</footer>

</body>
</html>
